name: Trílogo → lançar orçamentos
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "modo (interno)"
        required: false
        default: name: Trílogo → DIAGNÓSTICO (só lê, não lança)
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet playwright
      - name: Diagnóstico
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MOTOR_URL: ${{ secrets.MOTOR_URL }}
          ROBOT_KEY: ${{ secrets.ROBOT_KEY }}
          TRILOGO_EMAIL: ${{ secrets.TRILOGO_EMAIL_INSTALACOES }}
          TRILOGO_SENHA: ${{ secrets.TRILOGO_SENHA_INSTALACOES }}
        run: python trilogo_diag.py"lancar"
      alvo:
        description: "origem/arquivo específico (vazio = todos)"
        required: false
        default: ""
# 2 cliques seguidos não rodam em paralelo (evita lançar o MESMO orçamento 2x) — o 2º fica na fila
concurrency:
  group: trilogo-lancar
  cancel-in-progress: false
jobs:
  lancar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # SEM 'playwright install' (era ~2-3 min por rodada): o robô usa o CHROME que já
      # vem instalado no runner do GitHub (channel='chrome'). Só a lib python é instalada.
      - run: pip install --quiet playwright
      - name: Instalações (jonas)
        env:
          MOTOR_URL: ${{ secrets.MOTOR_URL }}
          ROBOT_KEY: ${{ secrets.ROBOT_KEY }}
          LIMITE: ${{ vars.LIMITE }}
          ALVO: ${{ github.event.inputs.alvo }}
          MODO: ${{ github.event.inputs.modo }}
          TRILOGO_EMAIL: ${{ secrets.TRILOGO_EMAIL_INSTALACOES }}
          TRILOGO_SENHA: ${{ secrets.TRILOGO_SENHA_INSTALACOES }}
          ABA: INSTALACOES
        run: python trilogo_lancar.py
      - name: Civil (humberto)
        env:
          MOTOR_URL: ${{ secrets.MOTOR_URL }}
          ROBOT_KEY: ${{ secrets.ROBOT_KEY }}
          LIMITE: ${{ vars.LIMITE }}
          ALVO: ${{ github.event.inputs.alvo }}
          MODO: ${{ github.event.inputs.modo }}
          TRILOGO_EMAIL: ${{ secrets.TRILOGO_EMAIL_CIVIL }}
          TRILOGO_SENHA: ${{ secrets.TRILOGO_SENHA_CIVIL }}
          ABA: CIVIL
        run: python trilogo_lancar.py
