name: Trílogo → chamados
# Agendamento REMOVIDO do GitHub — a execução agora é comandada pelo FrotaHub
# (disparo manual do builder ou pelo agendador do sistema, via workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "inicial (60 dias, carga) ou rotina (72h por atualização)"
        default: "rotina"
        type: choice
        options: [rotina, inicial]
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Instalações (jonas)
        env:
          TRILOGO_EMAIL: ${{ secrets.TRILOGO_EMAIL_INSTALACOES }}
          TRILOGO_SENHA: ${{ secrets.TRILOGO_SENHA_INSTALACOES }}
          ABA: INSTALACOES
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODO: ${{ github.event.inputs.modo || 'rotina' }}
        run: python trilogo_chamados.py
      - name: Civil (humberto)
        env:
          TRILOGO_EMAIL: ${{ secrets.TRILOGO_EMAIL_CIVIL }}
          TRILOGO_SENHA: ${{ secrets.TRILOGO_SENHA_CIVIL }}
          ABA: CIVIL
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODO: ${{ github.event.inputs.modo || 'rotina' }}
        run: python trilogo_chamados.py
